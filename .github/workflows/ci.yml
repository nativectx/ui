name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must precede typecheck: apps/demo, apps/storybook and the nativectx
      # wrapper all resolve @nativectx/ui through its compiled dist/, which
      # does not exist on a fresh checkout.
      - name: Build package
        run: pnpm build

      # The AI-facing surface of this package — the MCP component manifest, the
      # .claude/skills docs, and the JSDoc @example blocks — describes the
      # library but is not compiled by it, so nothing below would notice it
      # going stale. `pnpm check` re-derives the manifest from source, asserts
      # the skill docs still match it, and compile-checks every @example.
      # Runs first of the checks: it costs seconds, and it is the only step
      # here that can fail for reasons lint/typecheck/test are blind to.
      # It runs after Build package because the checks read the manifest the
      # build emits to ui/dist/mcp/.
      - name: AI docs sync (MCP manifest, skills, @example blocks match the library)
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build demo
        run: pnpm export:web

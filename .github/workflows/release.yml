name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.2)'
        required: true
        type: string
      publish_cli:
        description: 'Also publish the nativectx CLI alias (requires its own trusted publisher)'
        type: boolean
        default: true

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup npm for trusted publishing
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Test package
        run: pnpm test

      - name: Publish @nativectx/ui to npm with OIDC
        working-directory: ui
        run: |
          pnpm pack --pack-destination ../release-artifacts/ui
          npm publish ../release-artifacts/ui/*.tgz --access public

      # pnpm pack resolves workspace:^ to the library's release version.
      - name: Publish nativectx CLI alias to npm with OIDC
        if: github.event_name != 'workflow_dispatch' || inputs.publish_cli
        working-directory: nativectx
        run: |
          pnpm pack --pack-destination ../release-artifacts/cli
          npm publish ../release-artifacts/cli/*.tgz --access public

  deploy-production:
    name: Deploy Demo to Production
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Deploy to production
        run: pnpm deploy:web

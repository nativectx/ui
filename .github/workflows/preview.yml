name: Preview Deploy

# Opt-in only. EAS Hosting is metered, so preview deploys do not run on
# every PR — add the `preview` label to a PR to deploy it, remove and
# re-add to redeploy. Pushes to a labelled PR redeploy automatically.
on:
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'preview')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Deploy to preview
        run: pnpm deploy:preview

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployed to EAS Hosting — see the run log for the preview URL.'
            })
